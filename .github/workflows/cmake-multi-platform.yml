name: Build and test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build_type: [Debug, Release]
        compiler: [gcc, clang]
        include:
          - os: windows-latest
            build_type: Debug
            compiler: cl
          - os: windows-latest
            build_type: Release
            compiler: cl
          - os: macos-latest
            build_type: Debug
            compiler: clang
          - os: macos-latest
            build_type: Release
            compiler: clang
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          compiler_args=()
          if [[ -n '${{ matrix.compiler }}' ]]; then
            compiler_args+=('-DCMAKE_C_COMPILER=${{ matrix.compiler }}')
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} "${compiler_args[@]}"
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
      - name: Test (includes heavy scenarios and the shared library)
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure --parallel 4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-log-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.compiler || 'default' }}
          path: build/Testing/Temporary/LastTest.log

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DREL4U_ENABLE_SANITIZERS=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure --parallel 4
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sanitizer-test-log
          path: build/Testing/Temporary/LastTest.log

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DREL4U_ENABLE_COVERAGE=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure --parallel 4
      - run: python -m pip install gcovr
      - name: Report line and branch coverage
        run: gcovr --root . --filter src/ --exclude-unreachable-branches --html-details build/coverage.html --xml build/coverage.xml --print-summary
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            build/coverage*.html
            build/coverage.xml
